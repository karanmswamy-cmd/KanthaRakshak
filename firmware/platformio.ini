; PlatformIO Project Configuration File for JeevaSwara ESP32 Firmware
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino

; Serial Monitor
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

; Upload Settings
upload_speed = 921600

; Dependencies
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit BusIO @ ^1.16.1
    Wire

; Compiler Flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2
    -Iinclude

; Partition Scheme (Default with BLE support)
board_build.partitions = default.csv
